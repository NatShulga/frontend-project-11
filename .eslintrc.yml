env:
  browser: true
  es2021: true
extends: airbnb-base
overrides: []
parserOptions:
  ecmaVersion: latest
  sourceType: module
rules:
  quotes: ["error", "single"]
  indent: ["error", ""]
  space-in-parens: ["off"]
  no-spaced-func": "off"
  func-call-spacing: "off"
  object-curly-newline: ["error", "always"]
  no-param-reassign: 0
  no-underscore-dangle: [2, { "allow": ["__filename", "__dirname"] }]
  no-console: 0
  operator-linebreak: "off"
  import/extensions:
    - error
    - ignorePackages
    - js: always